entry_point: count_islands
signature: 'def count_islands(grid: list[str]) -> int:'
statement: '`grid` is a list of equal-length strings made of ''1'' (land) and ''0'' (water). An island
  is a group of land cells connected horizontally or vertically (not diagonally). Return the number of
  islands. An empty grid has 0 islands.'
