      - 2
    - - 2
      - 5
    - - 1
      - 3
  - 5
  expected: 2
- args:
  - - - 1
      - 4
  - 3
  expected: -1
- args:
  - - - 0
      - 0
  - 0
  expected: 1
compare: exact
