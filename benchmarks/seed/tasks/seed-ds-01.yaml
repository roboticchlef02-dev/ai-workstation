id: seed-ds-01
category: data_structures
difficulty: 3
entry_point: lru_simulate
signature: 'def lru_simulate(capacity: int, ops: list[list]) -> list[int]:'
statement: Simulate an LRU (least recently used) cache with the given capacity (>= 1). Each op is ['put',
  key, value] or ['get', key]. 'get' returns the value for key, or -1 if absent, and marks the key as
  most recently used. 'put' inserts or updates the key and marks it most recently used; if the cache then
  holds more than `capacity` keys, it evicts the least recently used key. Return the list of results of
  the 'get' ops, in order.
visible_tests:
- args:
  - 2
  - - - put
      - 1
      - 1
    - - put
      - 2
      - 2
    - - get
      - 1
    - - put
      - 3
      - 3
    - - get
      - 2
    - - put
      - 4
      - 4
    - - get
      - 1
    - - get
      - 3
    - - get
      - 4
  expected:
  - 1
  - -1
  - -1
  - 3
  - 4
- args:
  - 1
  - - - put
      - 1
      - 1
    - - get
      - 1
    - - put
      - 2
      - 2
    - - get
      - 1
    - - get
      - 2
  expected:
  - 1
  - -1
  - 2
- args:
  - 2
  - - - get
      - 5
  expected:
  - -1
compare: exact
