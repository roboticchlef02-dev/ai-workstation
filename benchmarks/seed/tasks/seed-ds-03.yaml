entry_point: teller_start_times
signature: 'def teller_start_times(arrivals: list[int], durations: list[int], tellers: int) -> list[int]:'
statement: 'Customer i arrives at time arrivals[i] (non-decreasing) and needs durations[i] (>= 1) time
  units of service. There are `tellers` (>= 1) identical tellers. Customers are served strictly in index
  order: customer i starts only after customer i-1 has started. A customer starts at the later of their
  arrival time and the moment some teller is free; a teller becomes free at the moment its previous service
  ends. Return the list of start times.'
