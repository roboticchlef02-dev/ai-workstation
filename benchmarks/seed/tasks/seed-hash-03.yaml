id: seed-hash-03
category: hash_maps
difficulty: 2
entry_point: longest_consecutive
signature: 'def longest_consecutive(nums: list[int]) -> int:'
statement: Return the length of the longest run of consecutive integers (x, x+1, x+2, ...) whose values
  all appear in `nums`. Order in the list does not matter and duplicates count once. An empty list gives
  0.
visible_tests:
- args:
  - - 100
    - 4
    - 200
    - 1
    - 3
    - 2
  expected: 4
- args:
  - []
  expected: 0
- args:
  - - 0
    - 3
    - 7
    - 2
    - 5
    - 8
    - 4
    - 6
    - 0
    - 1
  expected: 9
compare: exact
