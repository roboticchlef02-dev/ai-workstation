  def teller_start_times(arrivals, durations, tellers):
      import heapq
      free = [0] * tellers
      heapq.heapify(free)
      out = []
      prev_start = None
      for a, d in zip(arrivals, durations):
          t = heapq.heappop(free)
          start = max(a, t)
          if prev_start is not None:
              start = max(start, prev_start)
          out.append(start)
          prev_start = start
          heapq.heappush(free, start + d)
      return out
