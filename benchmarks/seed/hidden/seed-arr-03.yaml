  def product_except_self(nums):
      n = len(nums)
      out = [1] * n
      left = 1
      for i in range(n):
          out[i] = left
          left *= nums[i]
      right = 1
      for i in range(n - 1, -1, -1):
          out[i] *= right
          right *= nums[i]
      return out
