reference_solution: |
  def shortest_path_len(n, edges, src, dst):
      from collections import deque
      adj = [[] for _ in range(n)]
      for a, b in edges:
          adj[a].append(b)
          adj[b].append(a)
      dist = {src: 0}
      q = deque([src])
      while q:
          u = q.popleft()
          if u == dst:
              return dist[u]
          for v in adj[u]:
              if v not in dist:
                  dist[v] = dist[u] + 1
                  q.append(v)
      return -1
