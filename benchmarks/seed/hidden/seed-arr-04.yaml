  def compress_ranges(nums):
      out, i = [], 0
      while i < len(nums):
          j = i
          while j + 1 < len(nums) and nums[j + 1] == nums[j] + 1:
              j += 1
          if j - i >= 2:
              out.append(f"{nums[i]}..{nums[j]}")
          else:
              out.extend(str(x) for x in nums[i:j + 1])
          i = j + 1
      return ",".join(out)
