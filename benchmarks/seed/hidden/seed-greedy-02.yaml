  def min_jumps(nums):
      n = len(nums)
      if n == 1:
          return 0
      jumps = end = far = 0
      for i in range(n - 1):
          if i > far:
              return -1
          far = max(far, i + nums[i])
          if i == end:
              if far <= i:
                  return -1
              jumps += 1
              end = far
              if end >= n - 1:
                  return jumps
      return jumps if end >= n - 1 else -1
