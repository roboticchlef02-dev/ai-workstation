reference_solution: |
  def can_finish(n, prereqs):
      from collections import deque
      indeg = [0] * n
      adj = [[] for _ in range(n)]
      for a, b in prereqs:
          adj[b].append(a)
          indeg[a] += 1
      q = deque(i for i in range(n) if indeg[i] == 0)
      done = 0
      while q:
          u = q.popleft()
          done += 1
          for v in adj[u]:
              indeg[v] -= 1
              if indeg[v] == 0:
                  q.append(v)
      return done == n
