reference_solution: |
  def lru_simulate(capacity, ops):
      from collections import OrderedDict
      cache = OrderedDict()
      out = []
      for op in ops:
          if op[0] == "get":
              k = op[1]
              if k in cache:
                  cache.move_to_end(k)
                  out.append(cache[k])
              else:
                  out.append(-1)
          else:
              k, v = op[1], op[2]
              cache[k] = v
              cache.move_to_end(k)
              if len(cache) > capacity:
                  cache.popitem(last=False)
      return out
