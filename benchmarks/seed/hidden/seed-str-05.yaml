  def roman_to_int_strict(s):
      import re
      if not re.fullmatch(r"M{0,3}(CM|CD|D?C{0,3})(XC|XL|L?X{0,3})(IX|IV|V?I{0,3})", s) or not s:
          return -1
      vals = {"I": 1, "V": 5, "X": 10, "L": 50, "C": 100, "D": 500, "M": 1000}
      total = 0
      for i, ch in enumerate(s):
          v = vals[ch]
          if i + 1 < len(s) and vals[s[i + 1]] > v:
              total -= v
          else:
              total += v
      return total
