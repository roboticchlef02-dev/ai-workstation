reference_solution: |
  def min_platforms(arrivals, departures):
      events = sorted([(a, 0) for a in arrivals] + [(d, 1) for d in departures])
      cur = best = 0
      for _, kind in events:
          cur += 1 if kind == 0 else -1
          best = max(best, cur)
      return best
