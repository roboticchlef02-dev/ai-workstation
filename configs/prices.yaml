# List prices (USD per 1M tokens) used for shadow cost (D-016): every call is charged its
# list price, whatever is actually billed (free tier, credits). Budget caps use this number.
# Control plane: changed by the human only. Unknown model or date -> the call is refused.
# Periods: valid_from/valid_until are inclusive dates; open-ended if valid_until is absent.
# Earlier dates are not covered on purpose: no call in this project predates 2026-10-01.
version: "2026-10-02"
currency: USD
models:
  claude-haiku-4-5-20251001:
    provider: anthropic
    notes: "Extended-thinking tokens are billed as output."
    periods:
      - valid_from: 2026-10-01
        input_per_mtok: 1.00
        output_per_mtok: 5.00
        source: "Claude API skill model table (cached 2026-09-25); docs/DECISIONS.md fact check"
        verified: true
  gemini/gemini-3.8-flash:
    provider: gemini
    notes: >-
      Model ID verified via the models list (2026-10-02). Prices still from secondary
      sources, not Google's pricing page. Thinking tokens are billed as output.
    periods:
      - valid_from: 2026-10-01
        valid_until: 2026-12-31
        input_per_mtok: 0.75
        output_per_mtok: 3.75
        source: "secondary sources (pricing sites/news), not Google's page; intro price"
        verified: false
      - valid_from: 2027-01-01
        input_per_mtok: 1.50
        output_per_mtok: 7.50
        source: "secondary sources say the intro price doubles on 2027-01-01"
        verified: false
  mock-1:
    provider: mock
    notes: "Deterministic test provider. Costs nothing, but goes through the same ledger path."
    periods:
      - valid_from: 2026-10-01
        input_per_mtok: 0
        output_per_mtok: 0
        source: synthetic
        verified: true
  opencode/big-pickle:
    provider: opencode
    notes: >-
      OpenCode Zen free model (API name big-pickle). $0 list price, so shadow dollars can't
      budget-match it; see D-021 (match on calls + tokens). Other free Zen models are added
      after listing /zen/v1/models.
    periods:
      - valid_from: 2026-10-01
        input_per_mtok: 0
        output_per_mtok: 0
        source: "web search 2026-10-02 (OpenCode Zen docs: free model)"
        verified: false
  local/*:
    provider: local
    notes: "Any model served on this machine (Ollama, llama.cpp, LM Studio). No list price."
    periods:
      - valid_from: 2026-10-01
        input_per_mtok: 0
        output_per_mtok: 0
        source: "local inference has no per-token price"
        verified: true
  gemini/gemma-4-26b-a4b-it:
    provider: gemini
    notes: "Open-weights Gemma 4 served by the Gemini API. In the models list on 2026-10-02."
    periods:
      - valid_from: 2026-10-01
        input_per_mtok: 0
        output_per_mtok: 0
        source: "Gemma models on the Gemini API have been free of charge; not re-checked on Google's page"
        verified: false
  gemini/gemma-4-31b-it:
    provider: gemini
    notes: "Open-weights Gemma 4 served by the Gemini API. In the models list on 2026-10-02."
    periods:
      - valid_from: 2026-10-01
        input_per_mtok: 0
        output_per_mtok: 0
        source: "Gemma models on the Gemini API have been free of charge; not re-checked on Google's page"
        verified: false
  # --- Groq (free tier; billed $0). groq.com/pricing is JavaScript-rendered and could not be
  # read on 2026-10-02, so these are conservative builder estimates, not quoted prices. ---
  groq/openai/gpt-oss-20b:
    provider: groq
    periods:
      - valid_from: 2026-10-01
        input_per_mtok: 0.10
        output_per_mtok: 0.50
        source: "builder conservative estimate; not a quoted price"
        verified: false
  groq/openai/gpt-oss-120b:
    provider: groq
    periods:
      - valid_from: 2026-10-01
        input_per_mtok: 0.20
        output_per_mtok: 0.80
        source: "builder conservative estimate; not a quoted price"
        verified: false
  groq/qwen/qwen3.8-27b:
    provider: groq
    periods:
      - valid_from: 2026-10-01
        input_per_mtok: 0.40
        output_per_mtok: 0.80
        source: "builder conservative estimate; not a quoted price"
        verified: false
  # --- OpenRouter free models: $0, checked via the OpenRouter models API on 2026-10-02. ---
  openrouter/*:free:
    provider: openrouter
    notes: "Matches any OpenRouter model ID ending in :free. Free tier: about 50 requests/day without credits."
    periods:
      - valid_from: 2026-10-01
        input_per_mtok: 0
        output_per_mtok: 0
        source: "OpenRouter models API pricing fields = 0 (2026-10-02)"
        verified: true
  groq/allam-2-7b:
